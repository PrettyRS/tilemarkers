name: Release plugin

on:
  push:
    tags: ['v*', '[0-9]*']
  release:
    types: [published]
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.pull_request.head.ref || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # Only execute merged PR code after it has entered the trusted main branch.
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      EVENT_TAG: ${{ github.event.release.tag_name || github.ref_name }}
      RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
      RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || format('refs/tags/{0}', github.event.release.tag_name || github.ref_name) }}
          fetch-depth: 0

      - name: Prepare release metadata
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == pull_request_target ]]; then
            tag=$(python3 .github/scripts/release.py check "$RELEASE_BRANCH")
            jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/release-notes.md"
            existing_tag=$(git ls-remote origin "refs/tags/$tag")
            if [[ -n "$existing_tag" ]]; then
              git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
              if [[ $(git rev-parse "refs/tags/$tag^{commit}") != "$RELEASE_COMMIT" ]]; then
                echo "Tag $tag already exists at a different commit; refusing to publish." >&2
                exit 1
              fi
            fi
          else
            tag="$EVENT_TAG"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Build plugin ZIP
        run: python3 .github/scripts/release.py package "$RELEASE_TAG" "TileMarkers-${RELEASE_TAG}.zip"

      - name: Publish release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          version="${RELEASE_TAG#v}"
          if [[ "${version%%+*}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$EVENT_NAME" == pull_request_target ]]; then
              gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
            else
              gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
            fi
          elif [[ "$EVENT_NAME" == pull_request_target ]]; then
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" "TileMarkers-${RELEASE_TAG}.zip" --clobber
